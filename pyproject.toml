[project]
name = "wordstat"
version = "0.1.0"
description = "Export and validate Yandex Wordstat CSV reports through an existing Chrome session"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "browser-use",
    "click>=8.1",
    "pyarrow>=17",
    "pydantic>=2.12",
]

[project.scripts]
wordstat = "wordstat.cli:main"

[tool.uv.sources]
browser-use = { path = "../browser-use", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
